name = "currency"
main = "workers.js"
compatibility_date = "2024-06-01"

# 在 Cloudflare Dashboard 绑定 KV 后，取消注释并填入 namespace id：
# [[kv_namespaces]]
# binding = "EXCHANGE_KV"
# id = "your-kv-namespace-id"

# 在 Dashboard 或 wrangler secret 中配置：
# TG_BOT_TOKEN
# TG_CHAT_ID

[triggers]
crons = ["0 * * * *"]
